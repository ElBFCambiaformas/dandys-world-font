<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dandy's World Font Renderer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & base ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f1a;
      --surface:   #151828;
      --surface2:  #1e2235;
      --border:    #2a2f4a;
      --accent:    #ff6bac;
      --accent2:   #7eb8ff;
      --accent3:   #ffe066;
      --text:      #e8ecff;
      --muted:     #6b7299;
      --glow:      rgba(255, 107, 172, 0.25);
      --radius:    14px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      overflow-x: hidden;
    }

    /* subtle star-field background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 15%, rgba(255,255,255,.3)  0%, transparent 100%),
        radial-gradient(1px 1px at 75% 80%, rgba(255,255,255,.2)  0%, transparent 100%),
        radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,.3)  0%, transparent 100%),
        radial-gradient(1px 1px at 20% 85%, rgba(255,255,255,.2)  0%, transparent 100%),
        radial-gradient(1px 1px at 65% 50%, rgba(255,255,255,.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 90%, rgba(255,255,255,.2)  0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ─────────────────────────────────────────────────────── */
    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    header {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeDown .6s ease both;
    }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 8px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 0 20px var(--glow);
      animation: pulse 3s ease-in-out infinite;
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2rem, 5vw, 3rem);
      background: linear-gradient(120deg, var(--accent), var(--accent2), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: .5px;
      line-height: 1.1;
    }

    .subtitle {
      color: var(--muted);
      font-size: .95rem;
      margin-top: 6px;
    }

    /* ── Card ───────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 20px;
      animation: fadeUp .5s ease both;
    }
    .card:nth-child(2) { animation-delay: .1s; }
    .card:nth-child(3) { animation-delay: .2s; }

    .card-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.05rem;
      color: var(--accent2);
      letter-spacing: .5px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title::before {
      content: '';
      display: block;
      width: 4px;
      height: 18px;
      background: linear-gradient(to bottom, var(--accent), var(--accent2));
      border-radius: 2px;
    }

    /* ── Textarea ───────────────────────────────────────────────────── */
    textarea {
      width: 100%;
      min-height: 90px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 1.1rem;
      padding: 14px 16px;
      resize: vertical;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255,107,172,.15);
    }
    textarea::placeholder { color: var(--muted); }

    /* ── Controls grid ──────────────────────────────────────────────── */
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: .82rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .8px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: var(--surface2);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      border: 1px solid var(--border);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 8px var(--glow);
      cursor: pointer;
      transition: transform .15s;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

    .range-value {
      font-size: .85rem;
      color: var(--accent3);
      font-weight: 700;
      min-width: 36px;
      text-align: right;
    }
    .range-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* colour swatch */
    .color-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type="color"] {
      -webkit-appearance: none;
      width: 36px; height: 36px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: none;
      cursor: pointer;
      padding: 2px;
      transition: border-color .2s;
    }
    input[type="color"]:hover { border-color: var(--accent); }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; border-radius: 5px; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 5px; }

    .color-hex {
      font-size: .85rem;
      color: var(--muted);
      font-family: monospace;
    }

    /* ── Mode toggle ────────────────────────────────────────────────── */
    .mode-toggle {
      display: flex;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      width: 100%;
    }
    .mode-toggle button {
      flex: 1;
      padding: 9px 8px;
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'Nunito', sans-serif;
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .mode-toggle button.active {
      background: linear-gradient(135deg, var(--accent), #c44d8a);
      color: #fff;
    }

    /* tint color (shown/hidden) */
    #tintGroup { transition: opacity .2s; }
    #tintGroup.hidden { opacity: .3; pointer-events: none; }

    /* ── Preview area ───────────────────────────────────────────────── */
    #preview-wrap {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 20px;
      position: relative;
    }

    #preview-canvas {
      max-width: 100%;
      image-rendering: auto;
      border-radius: 6px;
      display: none;
    }

    .placeholder-text {
      color: var(--muted);
      font-size: .95rem;
      text-align: center;
      pointer-events: none;
    }

    /* ── Buttons ────────────────────────────────────────────────────── */
    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      letter-spacing: .4px;
      cursor: pointer;
      transition: transform .15s, box-shadow .2s, filter .2s;
    }
    .btn:hover  { transform: translateY(-2px); filter: brightness(1.1); }
    .btn:active { transform: translateY(0); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #c44d8a);
      color: #fff;
      box-shadow: 0 4px 18px rgba(255,107,172,.3);
    }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* ── Status bar ─────────────────────────────────────────────────── */
    #status {
      margin-top: 12px;
      font-size: .82rem;
      color: var(--muted);
      min-height: 18px;
    }
    #status.ok  { color: #6dffb3; }
    #status.err { color: #ff6b6b; }

    /* ── Footer ─────────────────────────────────────────────────────── */
    footer {
      text-align: center;
      color: var(--muted);
      font-size: .82rem;
      margin-top: 40px;
      opacity: .6;
    }

    /* ── Animations ─────────────────────────────────────────────────── */
    @keyframes fadeDown {
      from { opacity:0; transform: translateY(-18px); }
      to   { opacity:1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(14px); }
      to   { opacity:1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 20px var(--glow); }
      50%      { box-shadow: 0 0 36px rgba(255,107,172,.5); }
    }

    /* ── Responsive ─────────────────────────────────────────────────── */
    @media (max-width: 500px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .btn { padding: 10px 16px; font-size: .9rem; }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <!-- Header -->
  <header>
    <div class="logo-row">
      <h1>Dandy's World Font</h1>
    </div>
    <p class="subtitle">Type text · render with the original letter art · save as PNG</p>
  </header>

  <!-- Text input card -->
  <div class="card">
    <div class="card-title">Your Text</div>
    <textarea id="textInput" placeholder="Type something… (A–Z, spaces, new lines)" spellcheck="false">HELLO WORLD</textarea>

    <div class="controls">

      <!-- Height -->
      <div class="control-group">
        <label>Letter Height</label>
        <div class="range-row">
          <input type="range" id="heightRange" min="30" max="300" value="100" step="5" />
          <span class="range-value" id="heightVal">100px</span>
        </div>
      </div>

      <!-- Spacing -->
      <div class="control-group">
        <label>Letter Spacing</label>
        <div class="range-row">
          <input type="range" id="spacingRange" min="0" max="80" value="6" step="2" />
          <span class="range-value" id="spacingVal">6px</span>
        </div>
      </div>

      <!-- Line gap -->
      <div class="control-group">
        <label>Line Gap</label>
        <div class="range-row">
          <input type="range" id="lineGapRange" min="0" max="80" value="10" step="2" />
          <span class="range-value" id="lineGapVal">10px</span>
        </div>
      </div>

      <!-- Padding -->
      <div class="control-group">
        <label>Padding</label>
        <div class="range-row">
          <input type="range" id="paddingRange" min="0" max="80" value="24" step="4" />
          <span class="range-value" id="paddingVal">24px</span>
        </div>
      </div>

      <!-- Background colour -->
      <div class="control-group">
        <label>Background</label>
        <div class="color-row">
          <input type="color" id="bgColor" value="#1e1e2e" />
          <span class="color-hex" id="bgColorHex">#1e1e2e</span>
        </div>
      </div>

      <!-- Mode toggle -->
      <div class="control-group">
        <label>Mode</label>
        <div class="mode-toggle">
          <button id="modeOriginal" class="active" onclick="setMode('original')">🎨 Original</button>
          <button id="modeTint"     class=""       onclick="setMode('tint')">🖌️ Tint</button>
        </div>
      </div>

      <!-- Tint colour -->
      <div class="control-group" id="tintGroup">
        <label>Tint Color</label>
        <div class="color-row">
          <input type="color" id="tintColor" value="#ffffff" />
          <span class="color-hex" id="tintColorHex">#ffffff</span>
        </div>
      </div>

    </div><!-- .controls -->
  </div><!-- .card -->

  <!-- Preview card -->
  <div class="card">
    <div class="card-title">Preview</div>
    <div id="preview-wrap">
      <canvas id="preview-canvas"></canvas>
      <p class="placeholder-text" id="placeholder">Your rendered text will appear here ✨</p>
    </div>
    <div id="status"></div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="saveImage()">💾 Save PNG</button>
      <button class="btn btn-secondary" onclick="copyToClipboard()">📋 Copy Image</button>
    </div>
  </div>

  <footer>Dandy's World font art — fan-made renderer</footer>
</div><!-- .wrapper -->

<script>
// ── State ──────────────────────────────────────────────────────────────────
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const images  = {};   // letter -> HTMLImageElement
let   loaded  = 0;
let   mode    = 'original';   // 'original' | 'tint'
let   renderPending = false;

// ── Image loading ──────────────────────────────────────────────────────────
function loadImages() {
  setStatus('Loading letter images…', '');
  LETTERS.split('').forEach(ch => {
    const img = new Image();
    img.onload  = () => { images[ch] = img; loaded++; if (loaded === 26) onAllLoaded(); };
    img.onerror = () => { loaded++; console.warn(`Missing: ${ch}.png`); if (loaded === 26) onAllLoaded(); };
    img.src = `font_images/${ch}.png`;
  });
}

function onAllLoaded() {
  const found = Object.keys(images).length;
  setStatus(`Loaded ${found}/26 letters — ready!`, 'ok');
  render();
}

// ── Mode toggle ────────────────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.getElementById('modeOriginal').classList.toggle('active', m === 'original');
  document.getElementById('modeTint').classList.toggle('active', m === 'tint');
  document.getElementById('tintGroup').classList.toggle('hidden', m === 'original');
  scheduleRender();
}

// ── Rendering ──────────────────────────────────────────────────────────────
function scheduleRender() {
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(() => { renderPending = false; render(); });
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

function applyTint(srcCanvas, hex) {
  const [tr,tg,tb] = hexToRgb(hex);
  const out = document.createElement('canvas');
  out.width  = srcCanvas.width;
  out.height = srcCanvas.height;
  const ctx  = out.getContext('2d');
  ctx.drawImage(srcCanvas, 0, 0);
  const d = ctx.getImageData(0,0,out.width,out.height);
  for (let i=0; i<d.data.length; i+=4) {
    if (d.data[i+3] > 0) {
      d.data[i]   = tr;
      d.data[i+1] = tg;
      d.data[i+2] = tb;
    }
  }
  ctx.putImageData(d,0,0);
  return out;
}

function getGlyph(ch, targetH) {
  if (!images[ch]) return null;
  const src = images[ch];
  const scale = targetH / src.naturalHeight;
  const w = Math.max(1, Math.round(src.naturalWidth * scale));

  // draw at target size
  const tmp = document.createElement('canvas');
  tmp.width  = w;
  tmp.height = targetH;
  const ctx  = tmp.getContext('2d');
  ctx.drawImage(src, 0, 0, w, targetH);

  if (mode === 'tint') {
    return applyTint(tmp, document.getElementById('tintColor').value);
  }
  return tmp;
}

function render() {
  const rawText  = document.getElementById('textInput').value || '';
  const canvas   = document.getElementById('preview-canvas');
  const ph       = document.getElementById('placeholder');

  if (!rawText.trim() || Object.keys(images).length === 0) {
    canvas.style.display = 'none';
    ph.style.display     = 'block';
    return;
  }

  const targetH  = parseInt(document.getElementById('heightRange').value);
  const spacing  = parseInt(document.getElementById('spacingRange').value);
  const lineGap  = parseInt(document.getElementById('lineGapRange').value);
  const padding  = parseInt(document.getElementById('paddingRange').value);
  const bgHex    = document.getElementById('bgColor').value;

  const lines = rawText.toUpperCase().split('\n');

  // Compute average glyph width for space sizing
  const sampleGlyphs = Object.values(images).slice(0,10);
  const avgW = sampleGlyphs.reduce((s,img) => {
    const sc = targetH / img.naturalHeight;
    return s + img.naturalWidth * sc;
  }, 0) / sampleGlyphs.length;
  const spaceW = Math.round(avgW * 0.5);

  // Layout each line
  const lineLayouts = lines.map(line => {
    const glyphs = [];
    for (const ch of line) {
      if (ch === ' ') { glyphs.push({ type:'space', w: spaceW }); continue; }
      if (!images[ch]) continue;
      const g = getGlyph(ch, targetH);
      glyphs.push({ type:'glyph', canvas:g, w: g.width });
    }
    const lineW = glyphs.reduce((s,g,i) => s + g.w + (i<glyphs.length-1 ? spacing : 0), 0);
    return { glyphs, lineW };
  });

  const totalW = Math.max(...lineLayouts.map(l=>l.lineW), 1);
  const totalH = lines.length * targetH + Math.max(0, lines.length-1) * lineGap;

  canvas.width  = totalW + padding*2;
  canvas.height = totalH + padding*2;

  const ctx = canvas.getContext('2d');
  const [br,bg,bb] = hexToRgb(bgHex);
  ctx.fillStyle = bgHex;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  let y = padding;
  for (const { glyphs } of lineLayouts) {
    let x = padding;
    for (let i=0; i<glyphs.length; i++) {
      const g = glyphs[i];
      if (g.type === 'glyph') ctx.drawImage(g.canvas, x, y);
      x += g.w + (i < glyphs.length-1 ? spacing : 0);
    }
    y += targetH + lineGap;
  }

  canvas.style.display = 'block';
  ph.style.display     = 'none';
  setStatus(`${canvas.width}×${canvas.height}px  ·  ${lines.length} line${lines.length!==1?'s':''}`, 'ok');
}

// ── Save / copy ────────────────────────────────────────────────────────────
function saveImage() {
  const canvas = document.getElementById('preview-canvas');
  if (canvas.style.display === 'none') return;
  const a = document.createElement('a');
  a.download = 'dandys_world_text.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
  setStatus('Saved!', 'ok');
}

async function copyToClipboard() {
  const canvas = document.getElementById('preview-canvas');
  if (canvas.style.display === 'none') return;
  try {
    canvas.toBlob(async blob => {
      await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
      setStatus('Copied to clipboard!', 'ok');
    });
  } catch(e) {
    setStatus('Copy failed — try Save instead.', 'err');
  }
}

// ── Status ─────────────────────────────────────────────────────────────────
function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls;
}

// ── Wire up controls ───────────────────────────────────────────────────────
document.getElementById('textInput').addEventListener('input', scheduleRender);

document.getElementById('heightRange').addEventListener('input', function() {
  document.getElementById('heightVal').textContent = this.value + 'px';
  scheduleRender();
});
document.getElementById('spacingRange').addEventListener('input', function() {
  document.getElementById('spacingVal').textContent = this.value + 'px';
  scheduleRender();
});
document.getElementById('lineGapRange').addEventListener('input', function() {
  document.getElementById('lineGapVal').textContent = this.value + 'px';
  scheduleRender();
});
document.getElementById('paddingRange').addEventListener('input', function() {
  document.getElementById('paddingVal').textContent = this.value + 'px';
  scheduleRender();
});
document.getElementById('bgColor').addEventListener('input', function() {
  document.getElementById('bgColorHex').textContent = this.value;
  scheduleRender();
});
document.getElementById('tintColor').addEventListener('input', function() {
  document.getElementById('tintColorHex').textContent = this.value;
  scheduleRender();
});

// ── Boot ───────────────────────────────────────────────────────────────────
loadImages();
</script>
</body>
</html>
